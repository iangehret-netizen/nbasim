<style>
/* Layout: broadcast graphics package. A scorebug header, stacked collapsible panels, a bottom nav rail. Team colors are injected as --tc / --tc2. */
:root {
 --bg: #eceef2; --panel: #ffffff; --panel2: #f4f5f8; --line: #d7dae2; --ink: #11141b; --ink2: #4c5262; --ink3: #808697;
 --accent: #e4572e; --good: #1f8a4c; --warn: #b7791f; --bad: #c0362c; --chip: #e7e9ef;
 --tc: #860038; --tc2: #FDBB30; --tcInk: #ffffff;
 --f-disp: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif; --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif; --f-num: 'JetBrains Mono', ui-monospace, Menlo, monospace;
 --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1016; --panel: #161a23; --panel2: #1d222d; --line: #2a303d; --ink: #eef0f5; --ink2: #a6adbd; --ink3: #737b8d; --chip: #252b38; --accent: #ff7a4d; --good: #4cc27f; --warn: #e3a64a; --bad: #ff6b5e; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0d1016; --panel: #161a23; --panel2: #1d222d; --line: #2a303d; --ink: #eef0f5; --ink2: #a6adbd; --ink3: #737b8d; --chip: #252b38; --accent: #ff7a4d; --good: #4cc27f; --warn: #e3a64a; --bad: #ff6b5e; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg) }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--tc) }
button { font: inherit; color: inherit; cursor: pointer }
input, select { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; max-width: 100% }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#app { max-width: 760px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) }
.wrap { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)) }
.num, .tab { font-family: var(--f-num); font-variant-numeric: tabular-nums }
h1, h2, h3, .disp { font-family: var(--f-disp); letter-spacing: .01em; text-wrap: balance; margin: 0 }
.eyebrow { font-family: var(--f-disp); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3) }
.muted { color: var(--ink2) } .faint { color: var(--ink3) } .small { font-size: 13px } .tiny { font-size: 12px }
.good { color: var(--good) } .bad { color: var(--bad) } .warn { color: var(--warn) }
/* scorebug header */
.bug { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--tc); color: var(--tcInk); display: flex; align-items: stretch; min-height: 54px }
.bug .tm { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px max(14px, env(safe-area-inset-left, 0px)); flex: 1; min-width: 0 }
.bug .ab { font-family: var(--f-disp); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: .02em }
.bug .rec { font-family: var(--f-num); font-size: 13px; opacity: .9 }
.bug .meta { background: var(--tc2); color: #111; display: flex; flex-direction: column; justify-content: center; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px 12px; text-align: right; font-family: var(--f-disp); font-weight: 700; line-height: 1.1; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%) }
.bug .meta small { font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .75 }
.bug .gear { background: none; border: 0; color: inherit; padding: 0 10px; font-size: 20px }
/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)) }
.nav-in { display: flex; width: 100%; max-width: 760px }
.nav button { flex: 1; background: none; border: 0; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--f-disp); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); border-top: 3px solid transparent }
.nav button.on { color: var(--ink); border-top-color: var(--tc) }
.nav svg { width: 22px; height: 22px }
/* panels */
.stack { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; padding-bottom: 12px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel2) }
.ph h3 { font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; flex: 1; min-width: 0 }
.ph .tag { width: 6px; align-self: stretch; background: var(--tc); margin: -10px 4px -10px -14px }
.ph button.fold { background: none; border: 0; color: var(--ink3); font-size: 18px; line-height: 1; padding: 2px 4px }
.pb { padding: 12px 14px }
.panel.closed .pb, .panel.closed .pt { display: none }
.panel.closed .ph { border-bottom: 0 }
.pt { overflow-x: auto }
/* buttons */
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; min-height: 42px; font-family: var(--f-disp); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase }
.btn.pri { background: var(--tc); color: var(--tcInk); border-color: transparent }
.btn.alt { background: var(--accent); color: #fff; border-color: transparent }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px }
.btn:disabled { opacity: .45 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row > .grow { flex: 1; min-width: 0 }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.seg { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; overflow-x: auto }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 6px; padding: 6px 10px; font-family: var(--f-disp); font-weight: 600; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); white-space: nowrap }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line) }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 600; white-space: nowrap }
.chip.b1 { background: #c98a52; color: #2b1606 } .chip.b2 { background: #b9c2cf; color: #1b2230 } .chip.b3 { background: #e2b93b; color: #2b2000 } .chip.b4 { background: #9b6ee8; color: #fff }
/* ratings */
.ovr { font-family: var(--f-disp); font-weight: 800; font-size: 18px; min-width: 34px; height: 30px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff }
.g5 { background: #7b3fe4 } .g4 { background: #1f8a4c } .g3 { background: #2f7fd1 } .g2 { background: #b7791f } .g1 { background: #8a8f9c }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--tc) }
/* lists */
.li { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left }
.li:first-child { border-top: 0 }
.li .grow { flex: 1; min-width: 0 }
.li .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--f-disp); font-weight: 700; font-size: 15px; flex: none; background: var(--tc); color: var(--tcInk) }
/* tables */
table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
table.t th { font-family: var(--f-disp); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; color: var(--ink3); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; position: sticky; top: 0; background: var(--panel) }
table.t td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap }
table.t th:first-child, table.t td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1 }
table.t tr.me td { background: color-mix(in srgb, var(--tc) 12%, var(--panel)) }
table.t tr.me td:first-child { background: color-mix(in srgb, var(--tc) 12%, var(--panel)) }
table.t th.on { color: var(--ink) }
.lnk { background: none; border: 0; padding: 0; font-weight: 600; text-align: left }
/* scoreboard */
.sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px }
.sb .side { display: flex; flex-direction: column; align-items: center; gap: 2px }
.sb .ab { font-family: var(--f-disp); font-weight: 800; font-size: 28px; padding: 2px 12px; border-radius: 6px; color: #fff }
.sb .sc { font-family: var(--f-disp); font-weight: 800; font-size: clamp(34px, 11vw, 46px); line-height: 1; white-space: nowrap }
.sb .clock { text-align: center; font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2) }
.feed { max-height: 360px; overflow-y: auto }
.feed div { padding: 7px 14px; border-top: 1px solid var(--line); font-size: 14px; display: flex; gap: 10px }
.feed .c { font-family: var(--f-num); font-size: 12px; color: var(--ink3); flex: none; width: 74px }
/* sheet */
.veil { position: fixed; inset: 0; background: rgba(5, 8, 14, .55); z-index: 40; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px) }
@media (min-width: 700px) { .veil { align-items: center } .sheet { border-radius: 16px; max-height: 88vh } }
.card-top { position: relative; padding: 18px 16px 16px; background: var(--tc); color: var(--tcInk); overflow: hidden }
.card-top::after { content: ""; position: absolute; right: -40px; top: -30px; width: 200px; height: 200px; border: 18px solid var(--tc2); border-radius: 50%; opacity: .35 }
.card-top .big { font-family: var(--f-disp); font-weight: 800; font-size: 34px; line-height: 1 }
.card-ovr { position: absolute; right: 16px; top: 16px; z-index: 1; background: var(--tc2); color: #111; border-radius: 10px; padding: 6px 10px; text-align: center; font-family: var(--f-disp); font-weight: 800; line-height: 1 }
.card-ovr b { display: block; font-size: 36px; white-space: nowrap } .card-ovr b.rng { font-size: 24px } .card-ovr small { font-size: 11px; letter-spacing: .1em }
.x { position: absolute; left: 10px; top: 8px; z-index: 2; background: rgba(0,0,0,.25); color: #fff; border: 0; border-radius: 50%; width: 32px; height: 32px; font-size: 18px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; font-weight: 500; max-width: calc(100% - 32px) }
.busy { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 14, .6); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--f-disp); font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase }
.meter { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--bad), var(--warn), var(--good)); position: relative }
.meter i { position: absolute; top: -4px; width: 4px; height: 18px; background: var(--ink); border-radius: 2px }
.hero-t { padding: 28px 0 8px }
.hero-t h1 { font-size: 54px; font-weight: 800; line-height: .9; text-transform: uppercase }
.hero-t h1 span { color: var(--accent) }
.era { text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 14px; align-items: center }
.era .yr { font-family: var(--f-disp); font-weight: 800; font-size: 34px; width: 74px; flex: none }
.era.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset }
.era:disabled { opacity: .55 }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.tbtn { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: center }
.tbtn .sw { width: 10px; align-self: stretch; border-radius: 4px }
.sk { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-top: 1px solid var(--line) }
.pips { display: flex; gap: 4px } .pips i { width: 16px; height: 8px; border-radius: 2px; background: var(--chip) } .pips i.on { background: var(--tc) }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .25s ease-out } @keyframes rise { from { transform: translate(-50%, 12px); opacity: 0 } } }

// ===== Season flow: days, real moves, All-Star, playoffs, awards =====
const STAT_KEYS = ['gp', 'gs', 'min', 'pts', 'oreb', 'dreb', 'ast', 'stl', 'blk', 'tov', 'fgm', 'fga', 'tpm', 'tpa', 'ftm', 'fta', 'pf', 'pm'];
function sumLines(lines) { const o = {}; for (const k of STAT_KEYS) o[k] = 0; for (const l of lines) for (const k of STAT_KEYS) o[k] += l[k] || 0; return o; }
function careerTotals(p, po) { return sumLines((p.stats || []).filter(l => l.po === (po ? 1 : 0))); }
function seasonTotals(p, y, po) { return sumLines((p.stats || []).filter(l => l.y === y && l.po === (po ? 1 : 0))); }
function perGame(t) { const g = t.gp || 1; return { gp: t.gp, gs: t.gs, mpg: t.min / g, ppg: t.pts / g, rpg: (t.oreb + t.dreb) / g, apg: t.ast / g, spg: t.stl / g, bpg: t.blk / g, tpg: t.tov / g, fg: t.fga ? t.fgm / t.fga : 0, tp: t.tpa ? t.tpm / t.tpa : 0, ft: t.fta ? t.ftm / t.fta : 0, ts: (t.fga + .44 * t.fta) ? t.pts / (2 * (t.fga + .44 * t.fta)) : 0, tpm: t.tpm / g }; }
function per(t) { if (!t.min) return 0; const v = (t.pts + t.oreb * .9 + t.dreb * .4 + t.ast * .8 + t.stl * 1.3 + t.blk * 1.0 - (t.fga - t.fgm) * .75 - (t.fta - t.ftm) * .45 - t.tov * 1.0 - t.pf * .35) / t.min * 36; return v * 1.2 + 3; }
function winShares(t) { return Math.max(0, (per(t) - 9) * t.min / 1800); }

// ----- daily sim -----
function todaysGames() { return G.schedule.filter(g => g.d === G.date && !g.r); }

function simDay(opts) {
 opts = opts || {};
 applyDatedEvents();
 const gs = todaysGames();
 for (const g of gs) {
  if (opts.skipUser && (g.h === G.user.team || g.a === G.user.team)) continue;
  const S = newGameState(g.h, g.a); simFullGame(S); const b = finishGame(S, g);
  if (g.h === G.user.team || g.a === G.user.team) userGameDone(b);

}
function endOfDay() {
 // recovery and injuries tick for everyone who had a day
 const played = {}; for (const g of G.schedule) if (g.d === G.date) { played[g.h] = 1; played[g.a] = 1; }
 for (const p of Object.values(G.players)) {
  if (!p.team || p.ret) continue;
  p.energy = clamp(p.energy + 34 + (p.team === G.user.team ? G.user.skills.mgmt * 4 : 0), 0, 100);
  if (p.inj && played[p.team]) { p.inj.g--; if (p.inj.g <= 0) { p.inj = null; if (p.team === G.user.team) news(p.name + ' is back from injury.', 'inj', p.team); fixRotation(p.team); } }
 }
 const d = G.date; G.date = dateAdd(G.date, 1);
 if (d.slice(8) === '01' || (G.date.slice(8) === '01')) { if (G.date.slice(8) === '01') powerRankings(); }
 if (G.date.slice(5) === seasonDates(G.year).allStar.slice(5) && !G.allStar) allStarWeekend();

}
function applyDatedEvents() {
 // real moves
 if (G.settings.history && !G.settings.fantasy) while (G.moveIdx < MOVES.length && MOVES[G.moveIdx][0] <= G.date) { applyMove(MOVES[G.moveIdx]); G.moveIdx++; }
 while (G.coachMoveIdx < COACH_MOVES.length && COACH_MOVES[G.coachMoveIdx][0] <= G.date) { const m = COACH_MOVES[G.coachMoveIdx++]; if (m[1] !== G.user.team) setCoach(m[1], m[2], m[3]); }
 if (G.settings.realInj && G.phase === 'regular') for (const ri_ of REAL_INJ) if (ri_[1] === G.date) { const p = Object.values(G.players).find(x => x.name === ri_[0] && x.team && !x.ret); if (p && !p.inj) injure(p, ri_[2], ri_[3]); }
}
function setCoach(team, name, txt) {

 let c = Object.values(G.coaches).find(x => x.name === name && !x.team && x.id !== (old && old.id)); if (!c) { c = { id: 'c' + Date.now() + ri(0, 999), name, age: 50, off: 66, def: 66, dev: 66, mot: 66, w: 0, l: 0, titles: 0, ai: true }; G.coaches[c.id] = c; }

}
function findPlayer(name) { return Object.values(G.players).find(p => p.name === name && !p.prospect) || Object.values(G.players).find(p => p.name === name); }
function applyMove(m) {
 const [date, headline, parts] = m; const done = [], skipped = [];
 for (const x of parts) {
  const p = findPlayer(x[0]); if (!p || p.prospect) continue;
  const to = x[1];
  if (p.ret) { skipped.push(p.name); continue; }
  const onUser = p.team === G.user.team && p.team, diverged = p.team !== p.realTeam;
  p.realTeam = to === 'FA' ? null : to;
  if (onUser || diverged || to === G.user.team) { skipped.push(p.name); continue; }
  const from = p.team; p.team = to === 'FA' ? null : to; if (x[2]) { p.sal = +x[2]; p.yrs = +x[3]; p.fa = false; } else if (p.yrs <= 0) { p.yrs = 1; }
  p.morale = 70; done.push(p.name); if (from) fixRotation(from); if (p.team) fixRotation(p.team);

}
function userGameDone(b) {
 const u = G.user, won = (b.h === u.team) === (b.hs > b.as);
 if (!b.po) { if (won) u.w++; else u.l++; } else { if (won) u.pw++; else u.pl++; }

}

// ----- morale and chemistry -----
function weeklyMorale() {
 for (const a of activeTeams()) {
  const t = T(a), r = roster(a), pct = t.w + t.l ? t.w / (t.w + t.l) : .5; const co = coachR(a);
  r.forEach((p, i) => {
   const line = p.stats.find(l => l.y === G.year && l.t === a && !l.po); const mpg = line && line.gp ? line.min / line.gp : 0;
   const want = i < 2 ? 32 : i < 5 ? 26 : i < 8 ? 16 : 6; let d = (mpg - want) * .25 + (pct - .5) * 6 + (co.mot - 70) * .05;
   if (p.inj) d = 0; p.morale = Math.round(clamp(p.morale + d, 5, 99));
   if (p.morale < 25 && p.ovr >= 72 && !p.demand) { p.demand = 1; news(p.name + ' has requested a trade from the ' + teamShort(a) + '.', 'big', a); }
   if (p.morale > 45) p.demand = 0;
  });
  t.chem = Math.round(clamp(sum(r.slice(0, 9).map(p => p.morale)) / Math.max(1, Math.min(9, r.length)) + (co.mot - 70) * .2, 20, 99));
 }
}
function powerRankings() {
 const list = activeTeams().map(a => { const t = T(a); const g = t.w + t.l; const pct = g ? t.w / g : .5; const md = g ? ((t.pf || 0) - (t.pa || 0)) / g : 0; return { a, s: pct * 60 + md * 1.5 + teamOvr(a) * .4 + (t.l10 || []).filter(x => x === 'W').length * .6 }; }).sort((x, y) => y.s - x.s);
 const prev = G.pr.length ? G.pr[0].list : null;
 G.pr.unshift({ d: G.date, list: list.map((x, i) => ({ a: x.a, r: i + 1, prev: prev ? (prev.find(y => y.a === x.a) || {}).r : null })) });
 if (G.pr.length > 12) G.pr.length = 12;
 news('Power rankings: ' + teamShort(list[0].a) + ' are No. 1.', 'gen');
}

// ----- All-Star weekend -----
function allStarWeekend() {
 const pick12 = conf => { const ps = Object.values(G.players).filter(p => p.team && !p.ret && confOf(p.team) === conf); return ps.map(p => { const t = seasonTotals(p, G.year); const pg = perGame(t); return { p, s: t.gp >= 10 ? pg.ppg * 1 + pg.rpg * .6 + pg.apg * .8 + p.ovr * .45 + (T(p.team).w / Math.max(1, T(p.team).w + T(p.team).l)) * 8 : 0 }; }).sort((x, y) => y.s - x.s).slice(0, 12).map(x => x.p); };
 const E = pick12('E'), W = pick12('W');
 const score = side => Math.round(sum(side.map(p => p.ovr)) / 12 * 1.55 + rnd(-10, 10));
 const es = score(E), ws = score(W);
 const all = E.concat(W); const mvp = (es > ws ? E : W).slice().sort((x, y) => y.ovr + rnd(0, 8) - x.ovr - rnd(0, 8))[0];
 const active = Object.values(G.players).filter(p => p.team && !p.ret && !p.inj);
 const dunkers = active.slice().sort((x, y) => (y.at.ddk + y.at.vrt) - (x.at.ddk + x.at.vrt)).slice(0, 4);
 const dunkWin = wpick(dunkers, p => Math.pow(p.at.ddk + p.at.vrt - 120, 2));
 const shooters = active.slice().sort((x, y) => (y.at.tp * 2 + perGame(seasonTotals(y, G.year)).tpm * 8) - (x.at.tp * 2 + perGame(seasonTotals(x, G.year)).tpm * 8)).slice(0, 8);
 const threeWin = wpick(shooters, p => Math.pow(p.at.tp - 60, 2.5));
 G.allStar = { E: E.map(p => p.id), W: W.map(p => p.id), es, ws, mvp: mvp.id, dunk: dunkers.map(p => p.id), dunkWin: dunkWin.id, three: shooters.map(p => p.id), threeWin: threeWin.id };
 for (const p of all) p.aw.push(G.year + ' All-Star');
 mvp.aw.push(G.year + ' All-Star MVP'); dunkWin.aw.push(G.year + ' Dunk contest champion'); threeWin.aw.push(G.year + ' Three-point contest champion');
 news('All-Star Game: ' + (es > ws ? 'East ' + es + ', West ' + ws : 'West ' + ws + ', East ' + es) + '. ' + mvp.name + ' named MVP. ' + dunkWin.name + ' wins the dunk contest; ' + threeWin.name + ' takes the three-point shootout.', 'big');
}

// ----- end of regular season, playoffs -----
function endRegularSeason() {
 G.phase = 'playoffs';
 const fmt = playoffFormat(G.year);
 const mk = conf => { const s = seedConference(conf); return [[s[0], s[7]], [s[3], s[4]], [s[2], s[5]], [s[1], s[6]]].map(([x, y]) => ({ hi: x, lo: y, hw: 0, lw: 0, g: [] })); };
 G.po = { E: [mk('E')], W: [mk('W')], F: null, round: 0, seeds: { E: seedConference('E'), W: seedConference('W') }, start: dateAdd(G.date, 3) };
 regularSeasonAwards();
 news('The regular season is over. Playoffs begin!', 'big');
}
function seriesOpen() { if (!G.po) return []; if (G.po.F) return G.po.F.done ? [] : [G.po.F]; const r = G.po.round; return G.po.E[r].concat(G.po.W[r]).filter(s => !s.done); }
function nextPlayoffGame() { // returns series and game number for all open series
 return seriesOpen().map(s => ({ s, n: s.hw + s.lw + 1, home: homeOf(s, s.hw + s.lw + 1) }));
}
function homeOf(s, n) { const fin = s === G.po.F && G.year < 2013; const hiHome = fin ? [1, 2, 6, 7].includes(n) : [1, 2, 5, 7].includes(n); return hiHome ? s.hi : s.lo; }
function playPlayoffGame(s, S) {
 const n = s.hw + s.lw + 1, home = homeOf(s, n), away = home === s.hi ? s.lo : s.hi;
 const rIdx = s === G.po.F ? 3 : G.po.round; const dd = dateAdd(G.po.start || G.date, rIdx * 15 + (n - 1) * 2); if (dd > G.date) G.date = dd;
 if (!S) { S = newGameState(home, away, { playoff: true }); simFullGame(S); }
 const b = finishGame(S, { id: 'po' + G.year + s.hi + s.lo + n }); s.g.push(b.id);
 const hiWon = (home === s.hi) === (b.hs > b.as); if (hiWon) s.hw++; else s.lw++;
 if (s.hi === G.user.team || s.lo === G.user.team) userGameDone(b);
 const need = 4;
 if (s.hw === need || s.lw === need) { s.done = true; s.win = s.hw === need ? s.hi : s.lo; s.lose = s.win === s.hi ? s.lo : s.hi; news(teamName(s.win) + ' defeat the ' + teamShort(s.lose) + ' ' + Math.max(s.hw, s.lw) + '-' + Math.min(s.hw, s.lw) + '.', 'po'); if (s.win === G.user.team) { G.user.sp += 2; G.user.xp += 20; } }
 for (const p of Object.values(G.players)) if (p.team && !p.ret) { p.energy = clamp(p.energy + 30, 0, 100); if (p.inj && (p.team === s.hi || p.team === s.lo)) { p.inj.g--; if (p.inj.g <= 0) p.inj = null; } }
 return b;
}
function advancePlayoffs() {

 if (po.round === 2) { const e = po.E[2][0].win, w = po.W[2][0].win; const ew = T(e), ww = T(w); const eHi = ew.w / (ew.w + ew.l) >= ww.w / (ww.w + ww.l); po.F = { hi: eHi ? e : w, lo: eHi ? w : e, hw: 0, lw: 0, g: [] }; news('The NBA Finals: ' + teamName(po.F.hi) + ' vs. ' + teamName(po.F.lo) + '.', 'big'); return true; }
 for (const c of ['E', 'W']) { const prev = po[c][po.round]; const nxt = []; for (let i = 0; i < prev.length; i += 2) { const a = prev[i].win, b = prev[i + 1].win; const sa = po.seeds[c].indexOf(a), sb = po.seeds[c].indexOf(b); nxt.push(sa <= sb ? { hi: a, lo: b, hw: 0, lw: 0, g: [] } : { hi: b, lo: a, hw: 0, lw: 0, g: [] }); } po[c].push(nxt); }
 po.round++; return true;
}
function finishPlayoffs() {
 const F = G.po.F, champ = F.win; G.champs[G.year] = champ; T(champ).titles++;
 G.poTeams = poTeamsList();
 const fin = Object.values(G.players).filter(p => p.team === champ && !p.ret);
 for (const p of fin) p.aw.push(G.year + ' Champion');
 // Finals MVP
 const fm = fin.map(p => { const t = sumLines(p.stats.filter(l => l.y === G.year && l.po)); const ids = F.g; let pts = 0, reb = 0, ast = 0, gp = 0; for (const id of ids) { const b = G.games[id]; const s = b && b.p[p.id]; if (s) { gp++; pts += s[1]; reb += s[2] + s[3]; ast += s[4]; } } return { p, s: gp ? (pts + reb * .7 + ast * .8) / gp : 0 }; }).sort((x, y) => y.s - x.s)[0];
 G.awards[G.year].fmvp = fm ? fm.p.id : null; if (fm) fm.p.aw.push(G.year + ' Finals MVP');
 const co = G.coaches[T(champ).coach]; if (co && champ !== G.user.team) co.titles++;
 if (champ === G.user.team) { G.user.titles++; G.user.sp += 5; G.user.xp += 60; G.user.trophies.push({ y: G.year, t: 'NBA Champion' }); }
 news(teamName(champ) + ' win the ' + (G.year + 1) + ' NBA championship! ' + (fm ? fm.p.name + ' is Finals MVP.' : ''), 'big', champ);

 seasonEnd();
}

// ----- awards -----
function regularSeasonAwards() {
 const y = G.year, aw = G.awards[y] = { y };
 const ps = Object.values(G.players).filter(p => !p.ret && p.team).map(p => { const t = seasonTotals(p, y); const pg = perGame(t); return { p, t, pg }; }).filter(x => x.t.gp >= 41 || (x.t.gp >= 25 && x.pg.ppg > 20));
 const tw = a => { const t = T(a); return t.w / Math.max(1, t.w + t.l); };

 aw.smoy = by(ps.filter(x => x.t.gs < x.t.gp * .3), x => x.pg.ppg + x.pg.rpg * .4 + x.pg.apg * .5).slice(0, 3).map(x => x.p.id);
 aw.mip = by(ps.filter(x => x.p.exp > 0 && x.p.exp < 9), x => (x.p.ovr - (x.p.prevOvr || x.p.ovr)) * 1.5 + (x.pg.ppg - (x.p.prevPpg || x.pg.ppg)) * 1.2).slice(0, 3).map(x => x.p.id);
 const coy = activeTeams().map(a => ({ a, s: tw(a) * 82 - (T(a).projW || 41) })).sort((x, y) => y.s - x.s)[0];
 aw.coy = coy.a === G.user.team ? 'USER' : (G.coaches[T(coy.a).coach] || {}).name; aw.coyTeam = coy.a;
 const slot = (list, n) => { const out = []; const g = list.filter(x => ['PG', 'SG'].includes(x.p.pos)), f = list.filter(x => ['SF', 'PF'].includes(x.p.pos)), c = list.filter(x => x.p.pos === 'C' || (x.p.pos === 'PF' && x.p.ht >= 83)); const used = new Set(); for (let t = 0; t < n; t++) { const team = []; const take = (arr, k) => { for (const x of arr) { if (k <= 0) break; if (!used.has(x.p.id)) { used.add(x.p.id); team.push(x.p.id); k--; } } }; take(g, 2); take(f, 2); take(c, 1); out.push(team); } return out; };

 const lead = k => by(ps.filter(x => x.t.gp >= 58), x => x.pg[k])[0];
 aw.leaders = { ppg: lead('ppg'), rpg: lead('rpg'), apg: lead('apg'), spg: lead('spg'), bpg: lead('bpg') }; for (const k in aw.leaders) aw.leaders[k] = aw.leaders[k] ? aw.leaders[k].p.id : null;
 const give = (id, t) => { if (id) P(id).aw.push(y + ' ' + t); };
 give(aw.mvp[0], 'MVP'); give(aw.roy[0], 'Rookie of the Year'); give(aw.dpoy[0], 'Defensive Player of the Year'); give(aw.smoy[0], 'Sixth Man of the Year'); give(aw.mip[0], 'Most Improved Player');
 aw.allNBA.forEach((t, i) => t.forEach(id => give(id, ['All-NBA First Team', 'All-NBA Second Team', 'All-NBA Third Team'][i])));
 aw.allDef.forEach((t, i) => t.forEach(id => give(id, ['All-Defensive First Team', 'All-Defensive Second Team'][i])));
 aw.allRook.forEach((t, i) => t.forEach(id => give(id, ['All-Rookie First Team', 'All-Rookie Second Team'][i])));
 give(aw.leaders.ppg, 'Scoring title');
 if (aw.coy === 'USER') { G.user.coy++; G.user.sp += 2; G.user.trophies.push({ y, t: 'Coach of the Year' }); }
 news('Awards: ' + P(aw.mvp[0]).name + ' is MVP. ' + (aw.roy[0] ? P(aw.roy[0]).name + ' is Rookie of the Year. ' : '') + 'Coach of the Year: ' + (aw.coy === 'USER' ? G.user.name : aw.coy) + '.', 'big');
}

// ===== Offseason: season end, lottery, scouting, draft, re-signing, free agency, progression, preseason =====
const PHASES = { awards: 'Season review', lottery: 'Draft lottery', scouting: 'Scouting and combine', draft: 'NBA Draft', resign: 'Re-sign players', fa: 'Free agency', progression: 'Player development', preseason: 'Training camp', regular: 'Regular season', playoffs: 'Playoffs', over: 'Dynasty complete' };
const EXPANSION = { 2004: { team: 'CHA', coach: 'Bernie Bickerstaff', picks: 'Primoz Brezec,Gerald Wallace,Jason Kapono,Zaza Pachulia,Predrag Drobnjak,Eddie House,Melvin Ely,Steve Smith,Tamar Slay,Aleksandar Radojevic,Brandon Hunter,Malik Allen' } };
const LAST_YEAR = 2026;

function progExpected(p) {
 const gap = p.pot - p.ovr, a = p.age;
 let d = a <= 20 ? gap * .32 + 1.5 : a <= 22 ? gap * .28 + 1 : a <= 24 ? gap * .25 + .5 : a <= 26 ? gap * .25 : a <= 29 ? gap * .25 - .3 : a <= 31 ? -1 : a <= 33 ? -2.3 : a <= 35 ? -3.5 : -5;

 return d;
}
function progDelta(p) {
 const exp = progExpected(p);

 if (!usersOwn) return Math.round(exp);
 const co = coachR(p.team); const line = p.stats.find(l => l.y === G.year - 1 && !l.po); const mpg = line && line.gp ? line.min / line.gp : 0;

}
function applyProgression(p, d) {

}

// ----- after the Finals -----
function seasonEnd() {
 const u = G.user, y = G.year;
 // standings snapshot
 G.history[y] = { st: standings().map(s => ({ a: s.a, w: s.w, l: s.l })), champ: G.champs[y], mvp: G.awards[y] && G.awards[y].mvp[0], user: { team: u.team, w: u.w, l: u.l, pw: u.pw, pl: u.pl } };
 u.seasons.push({ y, team: u.team, w: u.w, l: u.l, pw: u.pw, pl: u.pl, po: playoffResult(u.team) });
 u.cw += u.w; u.cl += u.l;
 // job security review
 const res = playoffResult(u.team), goal = u.goals || { wins: 41, round: 0 };
 const roundReached = { 'Missed playoffs': 0, 'First round': 1, 'Conference semifinals': 2, 'Conference finals': 3, 'NBA Finals': 4, 'Champion': 5 }[res] || 0;
 let d = (u.w - goal.wins) * 1.6 + (roundReached - goal.round) * 7 + (res === 'Champion' ? 25 : 0);
 if (u.role === 'PR') d *= .6;

 u.xp += u.w;
}
function playoffResult(a) {

 const c = confOf(a); if (!G.po[c] || !G.po[c][0].some(s => s.hi === a || s.lo === a)) return 'Missed playoffs';
 const rounds = G.po[c]; for (let i = rounds.length - 1; i >= 0; i--) if (rounds[i].some(s => s.hi === a || s.lo === a)) return ['First round', 'Conference semifinals', 'Conference finals'][i];

}
// Called when the user continues from the season review
function startOffseason() {
 const u = G.user, y0 = G.year;
 if (y0 + 1 > LAST_YEAR) { G.phase = 'over'; return; }
 // coach fired?
 u.fired = u.sec < 15;
 if (u.fired) news(G.user.name + ' has been fired by the ' + teamShort(u.team) + '.', 'big', u.team);
 // AI coaching changes
 G.openings = [];
 for (const a of activeTeams()) {
  if (a === u.team) continue; const t = T(a), c = G.coaches[t.coach]; const pct = t.w / Math.max(1, t.w + t.l);
  if (c && (pct < .33 && Math.random() < .55 || pct < .45 && Math.random() < .12 || c.age >= 70 && Math.random() < .4)) { c.team = null; t.coach = null; G.openings.push(a); news(teamShort(a) + ' part ways with ' + c.name + '.', 'coach', a); }
 }
 // retirements
 for (const p of Object.values(G.players)) {
  if (p.ret || p.prospect) continue;
  let go = false;
  if (p.last !== undefined) go = p.last <= y0;
  else if (p.age >= 39) go = Math.random() < .85; else if (p.age >= 36) go = p.ovr < 72 && Math.random() < .55; else if (p.age >= 33) go = p.ovr < 62 && Math.random() < .4; else if (!p.team && p.age >= 30 && p.ovr < 60) go = Math.random() < .5;
  if (go) retirePlayer(p);
 }
 // records for MIP and progression
 for (const p of Object.values(G.players)) if (!p.ret && !p.prospect) { p.prevOvr = p.ovr; const t = perGame(seasonTotals(p, y0)); p.prevPpg = t.ppg; }
 G.year = y0 + 1; G.date = G.year + '-06-21';
 // age, contracts
 for (const p of Object.values(G.players)) {
  if (p.ret) continue; if (p.prospect) continue;
  p.age++; if (p.stats.some(l => l.y === y0)) p.exp++;
  if (p.rights) { p.rightsYrs = (p.rightsYrs || 0) + 1; }
  if (p.team || p.rights) { p.yrs--; if (p.yrs <= 0 && p.ext) { p.sal = p.ext.sal; p.yrs = p.ext.yrs; p.ext = null; news(p.name + "'s extension kicks in.", 'txn', p.team); } }
  if (p.opt === 'P' && p.yrs === 1 && p.team && marketValue(p, G.year) > p.sal * 1.15) { p.yrs = 0; p.opt = null; news(p.name + ' opts out of his contract with the ' + teamShort(p.team) + '.', 'txn', p.team); }
  if (p.team && p.yrs <= 0) { p.expiring = true; }
  p.inj = p.inj && p.inj.g > 30 ? { g: Math.max(0, p.inj.g - 30), d: p.inj.d } : null; if (p.inj && p.inj.g === 0) p.inj = null;

 }
 for (const a of Object.keys(G.teams)) { const t = T(a); t.projW = null; t.w = 0; t.l = 0; t.pf = 0; t.pa = 0; t.hw = t.hl = t.rw = t.rl = 0; t.streak = ''; t.l10 = []; t.mle = true; t.dead = []; }

 // coach aging

 for (const c of Object.values(G.coaches)) c.age++;
 // expansion

 // fill AI coaching vacancies (user gets first look via offers)

 // progression is applied now; user team handled in progression phase if manual

 for (const p of Object.values(G.players)) { if (p.ret || p.prospect || p.rights) continue; const d = progDelta(p); if (p.team === u.team && G.settings.prog === 'manual' && !G.settings.realCareer) { G.progPending[p.id] = d; } else { p.lastProg = d; applyProgression(p, d); } }
 // draft

 // drafted-and-stashed players can come over

function expansionDraft(ex) {

 const got = [];
 for (const n of ex.picks.split(',')) { const p = Object.values(G.players).find(x => x.name === n && !x.ret && x.team && !x.prospect); if (!p || p.team === G.user.team) continue; const from = p.team; p.team = ex.team; p.realTeam = ex.team; if (p.yrs <= 0) p.yrs = 1; got.push(n + ' (' + from + ')'); fixRotation(from); }

function runLottery() {

 const poTeams = new Set(); if (G.history[prev] && G.poTeams) G.poTeams.forEach(a => poTeams.add(a));
 const rec = s => s.w / Math.max(1, s.w + s.l);
 const non = st.filter(s => !poTeams.has(s.a)).sort((a, b) => rec(a) - rec(b) || Math.random() - .5);

 const lotto = non.map((s, i) => ({ a: s.a, o: odds[i] || 5 }));
 const exp = EXPANSION[y] ? EXPANSION[y].team : null;

 G.lottery = { top: top.map(x => x.a), odds: lotto };
 const jumped = top.map((x, i) => [x.a, i + 1, lotto.findIndex(l => l.a === x.a) + 1]);

}

// ----- scouting -----

// ----- the draft -----
function draftQueue() { return G.draftOrder.filter(o => !o.done); }
function rookieDeal(pick, r) { const ratio = eraFor(G.year).cap / 43.84; return r === 1 ? { sal: r1(4.0 * Math.pow(.945, pick - 1) * ratio * 10) / 10, yrs: 4 } : { sal: minSal(0, G.year), yrs: 2 }; }
function aiDraftPick(team) {

}

// ----- re-signing -----
function askingPrice(p) { const mv = marketValue(p, G.year); const mor = (70 - p.morale) / 250; return Math.max(minSal(p.exp, G.year), r1(mv * (1 + mor) * 10) / 10); }

}

}

  if (real) { p.team = null; p.fa = true; continue; } // real move will place him

  if (Math.random() < keep) { p.sal = Math.max(minSal(p.exp, G.year), r1(marketValue(p, G.year) * rnd(.85, 1.05) * 10) / 10); p.yrs = p.age >= 33 ? 1 : ri(1, 4); }
  else { p.team = null; p.fa = true; }

}
const FA_DAYS = ['07-01', '07-15', '08-01', '08-15', '09-01', '09-25'];

function faInterest(p, team) {

// ----- preseason -----

// ===== Trades =====
function playerValue(p, forTeam) {
 if (!p) return 0;
 const o = p.ovr, age = p.age;
 let v = Math.pow(Math.max(0, o - 45), 2.25) / 9;
 const upside = Math.max(0, p.pot - o); const youth = age <= 21 ? 1 : age <= 23 ? .8 : age <= 25 ? .5 : age <= 27 ? .2 : 0;
 v += Math.pow(upside, 1.6) * youth * 3;
 if (age >= 31) v *= Math.max(.35, 1 - (age - 30) * .1);
 const fair = marketValue(p, G.year); const yrs = Math.max(1, p.yrs);
 v -= (p.sal - fair) * Math.min(yrs, 4) * 6;
 if (p.inj && p.inj.g > 20) v *= .7;
 if (p.demand) v *= .85;
 if (forTeam && G.settings.diff) { /* reserved */ }
 return Math.round(v);
}
function pickValue(pk) {
 const team = pk.from; const o = T(team) && T(team).active ? teamOvr(team) : 75; const proj = clamp(Math.round(30 - (o - 66) * 1.6), 1, 30);
 const base = pk.r === 1 ? Math.max(25, 340 - proj * 11) : 22; return Math.round(base * Math.pow(.9, Math.max(0, pk.y - G.year)));
}
function pickLabel(pk) { return pk.y + ' ' + (pk.r === 1 ? '1st' : '2nd') + (pk.from ? ' (' + pk.from + ')' : ''); }
function tradeAllowed() { if (G.phase === 'regular' && G.date > seasonDates(G.year).deadline) return 'The trade deadline has passed.'; if (G.phase === 'playoffs') return 'Trades reopen after the Finals.'; if (G.user.role === 'HC') return null; return null; }
function evalTrade(other, give, get) {
 // give/get: {players:[ids], picks:[pick objs]}
 const us = G.user.team;
 const outV = sum(give.players.map(id => playerValue(P(id)))) + sum(give.picks.map(pickValue));
 const inV = sum(get.players.map(id => playerValue(P(id)))) + sum(get.picks.map(pickValue));
 const outS = sum(give.players.map(id => P(id).sal)), inS = sum(get.players.map(id => P(id).sal));
 const mult = (G.settings.tradeAI === 'easy' ? .88 : 1.07) - G.user.skills.trade * .03;
 const res = { outV, inV, outS: r1(outS), inS: r1(inS), ok: false, msg: '' };
 const ro = roster(other).length - get.players.length + give.players.length, ru = roster(us).length - give.players.length + get.players.length;
 if (!give.players.length && !give.picks.length) { res.msg = 'Add something to offer.'; return res; }
 if (ro > 15 || ru > 15) { res.msg = 'That would put a roster over 15 players.'; return res; }
 const cap = eraFor(G.year).cap;
 const capCheck = (team, inc, out) => payroll(team) - out + inc <= cap || inc <= out * 1.75 + .1;
 if (!capCheck(us, inS, outS)) { res.msg = 'Salaries need to be closer: you can take back up to ' + money(outS * 1.75 + .1) + '.'; return res; }
 if (!capCheck(other, outS, inS)) { res.msg = teamShort(other) + ' would be over the cap; they can take back up to ' + money(inS * 1.75 + .1) + '.'; return res; }
 if (G.phase === 'regular' && give.players.some(id => P(id).draft && P(id).draft.y === G.year && G.date < (G.year) + '-12-15')) { res.msg = 'Players signed or drafted this offseason can\'t be traded until mid-December.'; return res; }
 res.ok = outV >= inV * mult; res.need = Math.round(inV * mult - outV);
 res.msg = res.ok ? teamShort(other) + ' accept.' : teamShort(other) + ' want more value back (' + (res.need > 0 ? 'about ' + res.need + ' more' : 'close') + ').';
 return res;
}
function execTrade(other, give, get) {
 const us = G.user.team;
 for (const id of give.players) { const p = P(id); p.team = other; p.realTeam = p.realTeam; p.morale = 65; }
 for (const id of get.players) { const p = P(id); p.team = us; p.morale = 70; }
 for (const pk of give.picks) { const i = T(us).picks.indexOf(pk); if (i >= 0) T(us).picks.splice(i, 1); T(other).picks.push(pk); }
 for (const pk of get.picks) { const i = T(other).picks.indexOf(pk); if (i >= 0) T(other).picks.splice(i, 1); T(us).picks.push(pk); }
 // draft-day pick swaps already on the board
 if (G.draftOrder) for (const o of G.draftOrder) if (!o.done) { for (const pk of give.picks) if (pk.y === G.year && pk.r === o.r && pk.from === o.orig) o.team = other; for (const pk of get.picks) if (pk.y === G.year && pk.r === o.r && pk.from === o.orig) o.team = us; }
 const txt = teamShort(us) + ' trade ' + listAssets(give) + ' to the ' + teamShort(other) + ' for ' + listAssets(get) + '.';
 news(txt, 'txn', us); G.txn.unshift({ d: G.date, t: txt }); fixRotation(us); fixRotation(other);
}
function listAssets(x) { const a = x.players.map(id => P(id).name).concat(x.picks.map(pickLabel)); return a.length ? a.join(', ') : 'nothing'; }
// Suggest packages an AI team would accept for your player(s)
function tradeFinder(giveIds) {
 const us = G.user.team, out = [];
 for (const a of activeTeams()) {
  if (a === us) continue;
  const give = { players: giveIds, picks: [] };
  const outV = sum(giveIds.map(id => playerValue(P(id))));
  const outS = sum(giveIds.map(id => P(id).sal));
  const cands = roster(a).filter(p => playerValue(p) > 0).sort((x, y) => playerValue(y) - playerValue(x));
  let best = null;
  for (let i = 0; i < cands.length; i++) {
   const combo = [cands[i]];
   for (let j = i + 1; j < cands.length && sum(combo.map(p => p.sal)) < outS * .6; j++) if (sum(combo.map(p => playerValue(p))) + playerValue(cands[j]) <= outV) combo.push(cands[j]);
   const get = { players: combo.map(p => p.id), picks: [] };
   const r = evalTrade(a, give, get);
   if (r.ok) { const sc = r.inV; if (!best || sc > best.sc) best = { a, get, sc, r }; }
  }
  if (best) out.push(best);
 }
 return out.sort((x, y) => y.sc - x.sc).slice(0, 8);
}
// What would it take to get their player
function askFor(other, getIds) {
 const us = G.user.team; const get = { players: getIds, picks: [] };
 const mine = roster(us).filter(p => !getIds.includes(p.id)).sort((x, y) => playerValue(x) - playerValue(y));
 const inS = sum(getIds.map(id => P(id).sal)); const target = sum(getIds.map(id => playerValue(P(id))));
 for (let tries = 0; tries < 60; tries++) {
  const pool = mine.filter(p => playerValue(p) > 0); const combo = []; let v = 0, s = 0;
  const sh = pool.slice().sort(() => Math.random() - .5);
  for (const p of sh) { if (combo.length >= 4) break; if (v < target * 1.1 || s < inS / 1.75) { combo.push(p); v += playerValue(p); s += p.sal; } }
  const give = { players: combo.map(p => p.id), picks: [] }; const r = evalTrade(other, give, get);
  if (r.ok) return give;
 }
 return null;
}

// Fantasy draft: every rostered player goes into one pool, snake draft 13 rounds
function setupFantasy() {
 const pool = Object.values(G.players).filter(p => p.team && !p.ret && !p.prospect);
 for (const p of pool) { p.team = null; p.fpool = 1; }
 const order = activeTeams().sort(() => Math.random() - .5);
 G.fantasy = { order, round: 0, idx: 0, picks: [] };
 G.phase = 'fantasy';
 news('Fantasy draft: every player is up for grabs. Real-life moves are turned off for this dynasty.', 'big');
}
function fantasyOnClock() { const f = G.fantasy; if (f.round >= 13) return null; const ord = f.round % 2 ? f.order.slice().reverse() : f.order; return ord[f.idx]; }
function fantasyPick(p, team) { const f = G.fantasy; p.team = team; p.fpool = 0; p.realTeam = team; if (p.yrs <= 0) { p.yrs = ri(1, 3); p.sal = marketValue(p, G.year); } f.picks.push({ r: f.round + 1, team, id: p.id }); f.idx++; if (f.idx >= f.order.length) { f.idx = 0; f.round++; } }
function fantasyAI() {
 while (true) { const t = fantasyOnClock(); if (!t || t === G.user.team) break; const pool = Object.values(G.players).filter(p => p.fpool); const need = roster(t); const best = pool.sort((a, b) => (b.ovr + (b.age < 25 ? (b.pot - b.ovr) * .4 : 0) - (b.age > 32 ? 4 : 0)) - (a.ovr + (a.age < 25 ? (a.pot - a.ovr) * .4 : 0) - (a.age > 32 ? 4 : 0)))[0]; if (!best) break; fantasyPick(best, t); }
 if (!fantasyOnClock()) finishFantasy();
}
function finishFantasy() { for (const p of Object.values(G.players)) if (p.fpool) { p.fpool = 0; p.fa = true; p.team = null; } for (const a of activeTeams()) autoRotation(a); G.phase = 'scouting'; G.fantasy.done = true; news('The fantasy draft is complete.', 'big'); }

// Move forward one phase from the hub
function advancePhase() {
 const ph = G.phase;
 if (ph === 'awards') { startOffseason(); if (G.phase === 'lottery' && G.user.fired) { /* offers shown on lottery screen */ } return; }
 if (ph === 'lottery') { if (G.user.fired) return 'Pick a new job first.'; G.phase = 'scouting'; G.combineDone = false; return; }
 if (ph === 'scouting') { if (!G.combineDone) runCombine(); G.phase = 'draft'; G.date = G.year + '-06-26'; G.draftDone = false; return; }
 if (ph === 'draft') { aiDraftUntilUser(true); G.phase = 'resign'; return; }
 if (ph === 'resign') { enterFreeAgency(); return; }
 if (ph === 'fa') { while (!faAdvance()); aiFillRosters(); G.phase = Object.keys(G.progPending || {}).length ? 'progression' : 'preseason'; G.date = G.year + '-10-01'; return; }
 if (ph === 'progression') { finishManualProg(); G.phase = 'preseason'; return; }
 if (ph === 'preseason') { startRegularSeason(); return; }
}
function progPool() { return sum(Object.values(G.progPending || {}).map(d => Math.max(0, d))) + 6; }
function finishManualProg() {
 const pend = G.progPending || {}; const alloc = G.progAlloc || {};
 let left = progPool() - sum(Object.values(alloc));
 for (const id in pend) { const p = P(id); if (!p) continue; let d = (alloc[id] || 0) + Math.min(0, pend[id]); applyProgression(p, d); p.lastProg = d; }
 // leftover points go to the youngest players automatically
 const young = Object.keys(pend).map(P).filter(Boolean).sort((a, b) => a.age - b.age);
 while (left > 0 && young.length) { for (const p of young) { if (left <= 0) break; if ((alloc[p.id] || 0) + (p._auto || 0) < 12) { applyProgression(p, 1); p._auto = (p._auto || 0) + 1; left--; } } if (young.every(p => (alloc[p.id] || 0) + (p._auto || 0) >= 12)) break; }
 for (const p of young) delete p._auto;
 G.progPending = {}; G.progAlloc = {};
}

const SAVE_SLOTS = 5;
let _db = null;
function dbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open('nbaDynasty', 1); r.onupgradeneeded = () => r.result.createObjectStore('saves'); r.onsuccess = () => { _db = r.result; res(_db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function dbGet(k) { try { const db = _db || await dbOpen(); return await new Promise((res, rej) => { const q = db.transaction('saves').objectStore('saves').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { try { const s = localStorage.getItem('nbad_' + k); return s ? JSON.parse(s) : null; } catch (e2) { return MEMSAVE[k] || null; } } }
async function dbSet(k, v) { try { const db = _db || await dbOpen(); return await new Promise((res, rej) => { const tx = db.transaction('saves', 'readwrite'); tx.objectStore('saves').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); } catch (e) { try { localStorage.setItem('nbad_' + k, JSON.stringify(v)); return true; } catch (e2) { MEMSAVE[k] = v; return false; } } }

async function deleteSave(slot) { await dbSet('slot' + slot, null); const meta = (await dbGet('meta')) || {}; delete meta[slot]; await dbSet('meta', meta); }

 return '<section class="panel' + (closed ? ' closed' : '') + '"><div class="ph"><span class="tag"></span><h3>' + title + '</h3>' + (opts.right || '') + (opts.nofold ? '' : '<button class="fold" data-a="fold" data-v="' + id + '" aria-label="' + (closed ? 'Expand' : 'Collapse') + ' ' + esc(title) + '">' + (closed ? '+' : '−') + '</button>') + '</div>' + (opts.table ? '<div class="pt">' + body + '</div>' : '<div class="pb">' + body + '</div>') + '</section>';
}
function plainPanel(title, body, right) { return panel('x' + hash(title), title, body, { nofold: true, right }); }
function seg(name, opts, cur) { return '<div class="seg" role="tablist">' + opts.map(([v, l]) => '<button role="tab" aria-selected="' + (v === cur) + '" class="' + (v === cur ? 'on' : '') + '" data-a="seg" data-k="' + name + '" data-v="' + v + '">' + l + '</button>').join('') + '</div>'; }
function ovrBox(o) { return '<span class="ovr ' + ovrColor(o) + '">' + o + '</span>'; }
function plink(p, extra) { return '<button class="lnk" data-a="player" data-v="' + p.id + '">' + esc(p.name) + '</button>' + (extra || ''); }
function pRow(p, right, sub) {
 return '<button class="li" data-a="player" data-v="' + p.id + '"><span class="av" style="background:' + tcol(p.team || p.rights || G.user.team) + ';color:' + inkOn(tcol(p.team || p.rights || G.user.team)) + '">' + initials(p.name) + '</span><span class="grow"><div class="nm">' + esc(p.name) + (p.inj ? ' <span class="chip" style="background:var(--bad);color:#fff">INJ ' + p.inj.g + '</span>' : '') + '</div><div class="small muted">' + (sub || (p.pos + ' · ' + p.age + ' yrs · ' + htStr(p.ht))) + '</div></span>' + (right !== undefined ? right : ovrBox(p.ovr)) + '</button>';
}
function fmt(v, d) { return v === undefined || v === null || isNaN(v) ? '-' : Number(v).toFixed(d === undefined ? 1 : d); }
function pctS(v) { return v ? (v >= 1 ? '1.000' : v.toFixed(3).slice(1)) : '.000'; }
function table(cols, rows, opt) {
 opt = opt || {}; const sk = opt.sortKey;
 return '<table class="t"><thead><tr>' + cols.map(c => '<th' + (c[2] ? ' data-a="sort" data-v="' + c[2] + '"' : '') + (sk && sk === c[2] ? ' class="on"' : '') + '>' + c[0] + (sk && sk === c[2] ? (UI.sort.d < 0 ? ' ▾' : ' ▴') : '') + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr' + (r.me ? ' class="me"' : '') + '>' + r.c.map(x => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}

// ----- event delegation -----
const ACT = {};
document.addEventListener('click', e => {
 const el = e.target.closest('[data-a]'); if (!el) return;
 if (el.dataset.self && e.target !== el) return;
 const f = ACT[el.dataset.a]; if (!f) return;
 e.preventDefault(); f(el.dataset.v, el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (!el) return; const f = ACT[el.dataset.ch]; if (f) f(el.value, el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (!el) return; const f = ACT[el.dataset.in]; if (f) f(el.value, el, e); });
ACT.fold = v => { COLLAPSED[v] = !COLLAPSED[v]; try { localStorage.setItem('nbad_fold', JSON.stringify(COLLAPSED)); } catch (e) { } rerender(); };
ACT.seg = (v, el) => { UI.sub[el.dataset.k] = v; rerender(); };
ACT.tab = v => { UI.tab = v; UI.live = null; window.scrollTo(0, 0); render(); };
ACT.closeSheet = () => { UI.sheet = null; renderOverlays(); };
ACT.player = v => { UI.sheet = { kind: 'player', id: +v, tab: 'ratings' }; renderOverlays(); };
ACT.teamv = v => { UI.sheet = { kind: 'team', a: v }; renderOverlays(); };
ACT.sort = v => { if (UI.sort.k === v) UI.sort.d *= -1; else UI.sort = { k: v, d: -1 }; rerender(); };

// ----- busy runner for long sims -----
async function runSim(label, step, done) {
 UI.busy = label; renderOverlays(); await new Promise(r => setTimeout(r, 30));
 try { let n = 0; while (step()) { if (++n % 3 === 0) { UI.busy = label + ' · ' + niceDate(G.date); renderOverlays(); await new Promise(r => setTimeout(r, 0)); } } }
 catch (e) { console.error(e); toast('Something went wrong: ' + e.message); }
 UI.busy = null; if (done) done(); autosave(); render();
}
let saveT = 0;
function autosave() { clearTimeout(saveT); saveT = setTimeout(() => { if (G && G.slot) saveGame(G.slot).catch(() => { }); }, 400); }

ACT.ngera = v => { UI.ng.era = +v; rerender(); };
ACT.ngName = v => { UI.ng.name = v; };
ACT.ngAge = v => { UI.ng.age = clamp(+v || 40, 28, 70); };
ACT.ngopt = v => { UI.ng.opts[v] = !UI.ng.opts[v]; rerender(); };

const _seg = ACT.seg; ACT.seg = (v, el) => { const k = el.dataset.k; if (k === 'ngRole') UI.ng.role = v; else if (k === 'ngDiff') UI.ng.diff = v; else if (k === 'ngProg') UI.ng.opts.prog = v; else if (k === 'ngTrade') UI.ng.opts.tradeAI = v; else if (k === 'ngSlot') UI.ng.slot = +v; else return _seg(v, el); rerender(); };

ACT.trGo = () => {
 const tr = tradeState(); const r = evalTrade(tr.other, tr.give, tr.get); if (!r.ok) { toast(r.msg); return; }
 if (G.user.role === 'HC' && r.inV < r.outV * .8) { toast('Your GM vetoed the deal: you would give up too much.'); return; }
 execTrade(tr.other, tr.give, tr.get); UI.trade = null; toast('Trade complete.'); autosave(); rerender();
};
ACT.trFind = () => { const tr = tradeState(); tr.finder = tradeFinder(tr.give.players); rerender(); };
ACT.trLoad = v => { const tr = tradeState(), f = tr.finder[+v]; tr.other = f.a; tr.get = { players: f.get.players.slice(), picks: [] }; tr.finder = null; window.scrollTo(0, 0); rerender(); };
ACT.trAsk = () => { const tr = tradeState(); const g = askFor(tr.other, tr.get.players); if (!g) { toast("Couldn't find a package from your roster. Try adding picks."); return; } tr.give = g; rerender(); };
ACT.tradeFor = v => { const p = P(+v); UI.trade = null; const tr = tradeState(); tr.other = p.team; tr.get.players = [p.id]; UI.sheet = null; UI.tab = 'office'; UI.sub.office = 'trades'; renderOverlays(); render(); };
ACT.tradeWith = v => { UI.trade = null; tradeState().other = v; UI.sheet = null; UI.tab = 'office'; UI.sub.office = 'trades'; renderOverlays(); render(); };
ACT.shop = v => { UI.trade = null; const tr = tradeState(); tr.give.players = [+v]; tr.finder = tradeFinder([+v]); UI.sheet = null; UI.tab = 'office'; UI.sub.office = 'trades'; renderOverlays(); render(); };

function vFA() {
 const pos = UI.sub.fapos || 'ALL', us = G.user.team;
 const list = freeAgents().filter(p => pos === 'ALL' || p.pos === pos).slice(0, 80);
 let h = '<div class="grid2"><div class="panel pb"><div class="eyebrow">Cap room</div><div class="disp" style="font-size:22px;font-weight:800">' + money(Math.max(0, capRoom(us))) + '</div></div><div class="panel pb"><div class="eyebrow">Exceptions</div><div class="small">' + (T(us).mle ? 'Mid-level ' + money(mleAmount()) : 'Mid-level used') + '<br>Minimum deals<br>Bird rights on your own</div></div></div>';
 h += seg('fapos', [['ALL', 'All'], ['PG', 'PG'], ['SG', 'SG'], ['SF', 'SF'], ['PF', 'PF'], ['C', 'C']], pos);
 if (!['fa', 'resign', 'preseason', 'progression', 'regular'].includes(G.phase)) h += '<p class="small muted">You can sign free agents in free agency, training camp, and during the season.</p>';
 h += '<section class="panel">' + (list.length ? list.map(p => pRow(p, '<span style="text-align:right">' + ovrBox(p.ovr) + '<div class="tiny faint">asks ' + money(askingPrice(p)) + '</div></span>', p.pos + ' · ' + p.age + ' · ' + ARCH[p.arch][0] + (p.lastTeam ? ' · last ' + p.lastTeam : ''))).join('') : '<div class="pb muted">No free agents available.</div>') + '</section>';
 return h;
}

function vDraft() {
 if (!G.prospects.length && !(G.draftOrder && G.draftOrder.year === G.year && G.draftOrder.some(o => o.done))) {
  return plainPanel('Draft', '<p class="muted">The next draft class appears after the season. ' + (G.draftOrder && G.draftOrder.some(o => o.done) ? '' : '') + '</p>' + vDraftResults());
 }
 const s = UI.sub.dv || (G.phase === 'draft' ? 'board' : 'board');
 let h = seg('dv', [['board', 'Big board'], ['results', 'Draft order']], s);
 if (G.phase === 'draft') { const q = draftQueue(); if (q.length) { const mine = q[0].team === G.user.team; h += '<section class="panel pb"><div class="row"><span class="grow">On the clock: <b>' + teamName(q[0].team) + '</b> · pick ' + q[0].pick + '</span>' + (mine ? '<button class="btn sm" data-a="draftAuto">Auto-pick</button>' : '<button class="btn sm pri" data-a="draftSim">Sim to my pick</button>') + '</div>' + (mine ? '<p class="small good" style="margin:6px 0 0">You are on the clock. Tap a prospect to draft him.</p>' : '') + '</section>'; } else h += '<p class="small muted">The draft is complete.</p>'; }
 if (s === 'results') return h + vDraftResults();
 h += '<p class="small muted">Scouting points left: <b>' + (G.scout.pts - G.scout.used) + '</b>. Order the board with the arrows; auto-picks follow it.</p>';
 const avail = G.bigBoard.map(P).filter(p => p && !p.drafted);
 h += '<section class="panel">' + avail.map((p, i) => { const v = scoutView(p); return '<div class="li" style="cursor:default"><span class="num faint" style="width:22px">' + (i + 1) + '</span><span class="grow">' + plink(p) + '<div class="tiny muted">' + p.pos + ' · ' + htStr(p.ht) + ' · ' + p.age + ' · ' + esc(p.school || '') + (p.stash ? ' · stash' : '') + '</div></span><span style="text-align:right"><b class="num small">' + v.ovr + '</b><div class="tiny faint">POT ' + v.pot + '</div></span><button class="btn sm" data-a="bbUp" data-v="' + p.id + '" aria-label="Move up">▲</button><button class="btn sm" data-a="bbDn" data-v="' + p.id + '" aria-label="Move down">▼</button></div>'; }).join('') + '</section>';
 return h;
}
function vDraftResults() {
 if (!G.draftOrder) return '';
 return '<section class="panel">' + G.draftOrder.map(o => '<div class="li" style="cursor:default' + (o.team === G.user.team ? ';background:color-mix(in srgb,var(--tc) 10%,var(--panel))' : '') + '"><span class="num faint" style="width:26px">' + o.pick + '</span>' + teamTag(o.team) + '<span class="grow small">' + (o.player ? plink(P(o.player)) + ' <span class="faint">' + P(o.player).pos + '</span>' : '<span class="faint">' + (o.r === 1 ? 'Round 1' : 'Round 2') + '</span>') + '</span></div>').join('') + '</section>';
}
ACT.bbUp = v => { const b = G.bigBoard, i = b.indexOf(+v); if (i > 0) { let j = i - 1; while (j > 0 && P(b[j]).drafted) j--; [b[j], b[i]] = [b[i], b[j]]; } rerender(); };
ACT.bbDn = v => { const b = G.bigBoard, i = b.indexOf(+v); if (i < b.length - 1) { let j = i + 1; while (j < b.length - 1 && P(b[j]).drafted) j++; [b[j], b[i]] = [b[i], b[j]]; } rerender(); };
ACT.draftSim = () => { aiDraftUntilUser(false); autosave(); rerender(); };
ACT.draftAuto = () => { const o = draftQueue()[0]; makePick(o, userAutoPick(), false); aiDraftUntilUser(false); autosave(); rerender(); };
ACT.draftThis = v => { const o = draftQueue()[0]; if (!o || o.team !== G.user.team) return; const p = makePick(o, P(+v), false); UI.sheet = null; toast('You drafted ' + p.name + '.'); aiDraftUntilUser(false); autosave(); renderOverlays(); render(); };
ACT.draftStash = v => { const o = draftQueue()[0]; if (!o || o.team !== G.user.team) return; const p = makePick(o, P(+v), true); UI.sheet = null; toast(p.name + ' will develop overseas.'); aiDraftUntilUser(false); autosave(); renderOverlays(); render(); };

function vContracts() {
 const us = G.user.team, r = roster(us).sort((a, b) => b.sal - a.sal);
 const yrs = [0, 1, 2, 3].map(i => G.year + i);
 const rows = r.map(p => ({ c: [plink(p) + (p.expiring ? ' <span class="chip" style="background:var(--warn);color:#111">Expiring</span>' : ''), p.age, p.ovr].concat(yrs.map((y, i) => i < Math.max(0, p.yrs) ? money(p.sal) + (p.opt === 'P' && i === p.yrs - 1 ? ' PO' : '') : (p.ext && i >= p.yrs && i < p.yrs + p.ext.yrs ? money(p.ext.sal) + ' ext' : '<span class="faint">-</span>'))) }));
 const tot = yrs.map((y, i) => money(sum(r.filter(p => i < Math.max(0, p.yrs)).map(p => p.sal)) + sum(r.filter(p => p.ext && i >= p.yrs && i < p.yrs + p.ext.yrs).map(p => p.ext.sal))));
 rows.push({ c: ['<b>Total</b>', '', ''].concat(tot.map(t => '<b>' + t + '</b>')) });
 let h = '';
 if (G.phase === 'resign') { const ex = roster(us).filter(p => p.expiring); h += plainPanel('Expiring contracts', ex.length ? ex.map(p => pRow(p, '<span style="text-align:right">' + ovrBox(p.ovr) + '<div class="tiny faint">asks ' + money(askingPrice(p)) + '</div></span>', p.pos + ' · ' + p.age + ' · morale ' + p.morale)).join('') + '<p class="small muted">Tap a player to make an offer. You keep his Bird rights, so you can go over the cap.</p>' : '<p class="muted small">Nobody to re-sign.</p>'); }
 const dead = T(us).dead; if (dead.length) h += '<p class="small muted">Dead money this season: ' + dead.map(d => esc(d.n) + ' ' + money(d.sal)).join(', ') + '</p>';
 return h + panel('contracts', 'Payroll', table([['Player'], ['Age'], ['OVR']].concat(yrs.map(y => [seasonLabel(y)])), rows), { table: true, nofold: true }) + '<p class="small muted">Cap ' + money(eraFor(G.year).cap) + ' · luxury tax is off in this league.</p>';
}
function vProg() {
 const pend = G.progPending || {}; const ids = Object.keys(pend).map(Number); if (!ids.length) return plainPanel('Development', '<p class="muted">No points to hand out right now.</p>');
 G.progAlloc = G.progAlloc || {}; const used = sum(Object.values(G.progAlloc)), pool = progPool();
 let b = '<div class="row" style="margin-bottom:8px"><span class="grow">Points left: <b class="num">' + (pool - used) + '</b> of ' + pool + '</span><button class="btn sm" data-a="progReset">Reset</button></div><p class="small muted">Each player can gain up to 12. Rating drops for older players still happen on their own. Leftover points go to your youngest players.</p>';
 b += ids.map(P).sort((a, b) => a.age - b.age).map(p => { const a = G.progAlloc[p.id] || 0; return '<div class="row" style="padding:6px 0;border-top:1px solid var(--line)">' + ovrBox(p.ovr) + '<span class="grow">' + plink(p) + '<div class="tiny muted">' + p.age + ' yrs · POT ' + potGrade(p.pot) + ' · auto would be ' + (pend[p.id] >= 0 ? '+' : '') + pend[p.id] + '</div></span><b class="num" style="width:30px;text-align:right">+' + a + '</b><button class="btn sm" data-a="progAdd" data-v="' + p.id + ':1">+1</button><button class="btn sm" data-a="progAdd" data-v="' + p.id + ':3">+3</button><button class="btn sm" data-a="progAdd" data-v="' + p.id + ':-1" aria-label="Remove one">−</button></div>'; }).join('');
 return plainPanel('Player development', b);
}
ACT.progAdd = v => { const [id, n] = v.split(':').map(Number); const al = G.progAlloc; const left = progPool() - sum(Object.values(al)); let d = n > 0 ? Math.min(n, left, 12 - (al[id] || 0)) : Math.max(n, -(al[id] || 0)); al[id] = (al[id] || 0) + d; rerender(); };
ACT.progReset = () => { G.progAlloc = {}; rerender(); };

// ===== Coach tab: profile, trophies, skill tree, settings, saves =====
function vCoach() {
 const s = UI.sub.coach || 'profile';
 return seg('coach', [['profile', 'Profile'], ['skills', 'Skill tree'], ['settings', 'Settings'], ['saves', 'Saves']], s) + ({ profile: vProfile, skills: vSkills, settings: vSettings, saves: vSaves })[s]();
}
function vProfile() {
 const u = G.user, g = u.cw + u.cl + u.w + u.l, w = u.cw + u.w;
 let h = '<section class="panel"><div class="card-top"><div style="position:relative;z-index:1"><div class="eyebrow" style="color:inherit;opacity:.8">' + ROLES[u.role] + '</div><div class="big">' + esc(u.name) + '</div><div class="small" style="opacity:.9">Age ' + u.age + ' · ' + teamName(u.team) + '</div></div></div><div class="pb"><div class="grid2"><div><div class="eyebrow">Career record</div><div class="disp" style="font-size:26px;font-weight:800">' + w + '-' + (g - w) + '</div><div class="small muted">' + (g ? pctS(w / g) : '.000') + ' · playoffs ' + (sum(u.seasons.map(s => s.pw || 0)) + u.pw) + '-' + (sum(u.seasons.map(s => s.pl || 0)) + u.pl) + '</div></div><div><div class="eyebrow">Titles</div><div class="disp" style="font-size:26px;font-weight:800">' + u.titles + '</div><div class="small muted">Coach of the Year x' + u.coy + '</div></div></div><div class="row" style="margin-top:10px"><span class="grow small muted">Job security</span><b class="num">' + u.sec + '</b></div><div class="meter" style="margin-top:6px"><i style="left:calc(' + u.sec + '% - 2px)"></i></div><div class="small" style="margin-top:8px">' + (u.goalTxt ? 'Goal: ' + esc(u.goalTxt) : '') + '</div></div></section>';
 if ((G.offers && G.offers.length) || u.fired) h += plainPanel('Job market', vOffers());
 // trophy case: coaching and team trophies vs player awards earned under you
 const coachT = u.trophies.filter(t => !t.info);
 const playerAw = []; for (const p of Object.values(G.players)) for (const a of p.aw) { const y = +a.slice(0, 4); const s = u.seasons.find(x => x.y === y) || (y === G.year ? { team: u.team } : null); if (s && p.stats.some(l => l.y === y && l.t === s.team) && /MVP|All-NBA|Rookie of the Year|Defensive Player|Sixth Man|Most Improved|All-Star$|Scoring title/.test(a)) playerAw.push({ y, t: a.slice(5), n: p.name, id: p.id }); }
 h += '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))">' + plainPanel('Trophy case: coaching', coachT.length ? coachT.map(t => '<div class="row small" style="padding:4px 0"><span class="disp" style="font-size:20px;color:var(--tc2)">★</span><span class="grow"><b>' + esc(t.t) + '</b></span><span class="faint num">' + seasonLabel(t.y) + '</span></div>').join('') : '<p class="small muted">Win a title or Coach of the Year to fill this case.</p>') + plainPanel('Trophy case: your players', playerAw.length ? playerAw.sort((a, b) => b.y - a.y).map(t => '<div class="row small" style="padding:4px 0"><span class="grow">' + plink(P(t.id)) + ' <span class="muted">' + esc(t.t) + '</span></span><span class="faint num">' + seasonLabel(t.y) + '</span></div>').join('') : '<p class="small muted">Awards your players win under you show up here.</p>') + '</div>';
 h += plainPanel('Coaching history', u.seasons.length ? table([['Season'], ['Team'], ['W'], ['L'], ['Result']], u.seasons.slice().reverse().map(s => ({ c: [seasonLabel(s.y), s.team, s.w, s.l, esc(s.po)] }))).replace('<table', '<div class="pt" style="margin:-12px -14px"><table').replace('</table>', '</table></div>') : '<p class="small muted">Your first season is ahead of you.</p>');
 return h;
}
function vSkills() {
 const u = G.user;
 let b = '<div class="row" style="margin-bottom:8px"><span class="grow">Skill points: <b class="num">' + u.sp + '</b></span><span class="small muted">Earn points every 10 wins, for series wins, titles and Coach of the Year.</span></div>';
 b += SKILLS.map(([k, n, d]) => { const lv = u.skills[k], cost = lv + 1; return '<div class="sk"><div><b>' + n + '</b> ' + (lv ? '<span class="chip b' + lv + '">' + TIERS[lv] + '</span>' : '') + '<div class="small muted">' + d + '</div><div class="pips" style="margin-top:4px">' + [1, 2, 3, 4].map(i => '<i class="' + (i <= lv ? 'on' : '') + '"></i>').join('') + '</div></div><div>' + (lv < 4 ? '<button class="btn sm' + (u.sp >= cost ? ' pri' : '') + '" data-a="skillUp" data-v="' + k + '">' + TIERS[lv + 1] + ' · ' + cost + '</button>' : '<span class="small muted">Maxed</span>') + '</div></div>'; }).join('');
 return '<section class="panel"><div class="pb" style="padding-bottom:0">' + b.split('<div class="sk">')[0] + '</div>' + b.slice(b.indexOf('<div class="sk">')) + '</section>';
}
ACT.skillUp = v => { const u = G.user, lv = u.skills[v]; if (lv >= 4) return; if (u.sp < lv + 1) { toast('You need ' + (lv + 1) + ' skill points.'); return; } u.sp -= lv + 1; u.skills[v]++; toast(SKILLS.find(s => s[0] === v)[1] + ': ' + TIERS[u.skills[v]] + '.'); autosave(); rerender(); };
function vSettings() {
 const s = G.settings;
 const tg = (k, l, d) => '<div class="li" style="cursor:default"><span class="grow"><div class="nm">' + l + '</div><div class="small muted">' + d + '</div></span><button class="btn sm' + (s[k] ? ' pri' : '') + '" data-a="setTog" data-v="' + k + '" aria-pressed="' + !!s[k] + '">' + (s[k] ? 'On' : 'Off') + '</button></div>';
 let h = '<section class="panel">' + tg('history', 'Real-life moves', 'Real trades, signings and coaching changes play out unless they involve your players.') + tg('realCareer', 'Ratings follow real careers', 'Off: your own players develop through your coaching.') + tg('realInj', 'Real injuries', 'Famous injuries on their real dates.') + tg('injuries', 'Random injuries', 'Players can get hurt in games.') + tg('coachRetire', 'Coach retirement', 'Your coach can be forced to retire in his 70s.') + '</section>';
 h += '<div class="small muted">Progression</div>' + seg('setProg', [['auto', 'Auto'], ['manual', 'Manual dev points']], s.prog) + '<p class="tiny faint">Set before the season ends to apply this offseason.</p>';
 h += '<div class="small muted">AI trades</div>' + seg('setTrade', [['realistic', 'Realistic'], ['easy', 'Easy']], s.tradeAI);
 h += '<div class="small muted">Difficulty</div>' + seg('setDiff', Object.entries(DIFFS).map(([k, v]) => [k, v[0]]), s.diff);
 h += '<section class="panel"><div class="li" style="cursor:default"><span class="grow"><div class="nm">Dev mode</div><div class="small muted">Edit any player from his card: ratings, age, contract and team.</div></span><button class="btn sm' + (UI.dev ? ' pri' : '') + '" data-a="devTog">' + (UI.dev ? 'On' : 'Off') + '</button></div></section>';
 if (UI.dev) h += plainPanel('Edit coaches', Object.values(G.coaches).filter(c => c.team).sort((a, b) => a.team.localeCompare(b.team)).map(c => '<div class="row small" style="padding:4px 0">' + teamTag(c.team) + '<input value="' + esc(c.name) + '" data-ch="devCoachName" data-id="' + c.id + '" class="grow" aria-label="Coach name"><input type="number" value="' + c.off + '" data-ch="devCoachR" data-id="' + c.id + '" data-k="off" style="width:62px" aria-label="Offense"><input type="number" value="' + c.def + '" data-ch="devCoachR" data-id="' + c.id + '" data-k="def" style="width:62px" aria-label="Defense"></div>').join('') + '<p class="tiny muted">Name, offense, defense.</p>');
 h += plainPanel('About this build', '<p class="small">Round one: the LeBron era, starting in the 2003 offseason. The 2003-04 season, every real move from that year, and the 2003 and 2004 draft classes are loaded. Seasons 2004-05 through 2009-10 come next, then the Jordan and Kobe eras.</p><p class="small muted">Ratings are estimates based on real careers, not official 2K numbers. Some second-round picks, minor signings, and dates are approximate. Each team owns its own future picks; real traded picks are not loaded yet.</p>');
 h += '<button class="btn" data-a="quit" style="width:100%">Save and exit to title</button>';
 return h;
}
ACT.setTog = v => { G.settings[v] = !G.settings[v]; autosave(); rerender(); };
ACT.devTog = () => { UI.dev = !UI.dev; rerender(); };
ACT.devCoachName = (v, el) => { G.coaches[el.dataset.id].name = v; autosave(); };
ACT.devCoachR = (v, el) => { G.coaches[el.dataset.id][el.dataset.k] = clamp(+v || 60, 30, 99); autosave(); };
const _seg3 = ACT.seg; ACT.seg = (v, el) => { const k = el.dataset.k; if (k === 'setProg') G.settings.prog = v; else if (k === 'setTrade') G.settings.tradeAI = v; else if (k === 'setDiff') G.settings.diff = v; else return _seg3(v, el); autosave(); rerender(); };
ACT.quit = async () => { if (G.slot) await saveGame(G.slot); await refreshMeta(); UI.view = 'title'; UI.live = null; render(); };
function vSaves() {
 let b = [1, 2, 3, 4, 5].map(i => { const m = SAVE_META[i]; return '<div class="li" style="cursor:default"><span class="num" style="width:20px">' + i + '</span><span class="grow small">' + (m ? esc(m.coach) + ' · ' + m.team + ' · ' + seasonLabel(m.year) + ' · ' + (PHASES[m.phase] || m.phase) + (G.slot === i ? ' <span class="chip">Current</span>' : '') : '<span class="faint">Empty</span>') + '</span><button class="btn sm" data-a="saveTo" data-v="' + i + '">Save here</button></div>'; }).join('');
 b += '<div class="pb"><div class="row"><button class="btn" data-a="export">Export save file</button><label class="btn" for="impf2">Import</label><input id="impf2" type="file" accept=".json,application/json" hidden data-ch="importFile"></div><p class="tiny muted" style="margin-top:8px">The game saves on its own after every sim. Saves live in this browser only; export a file to move a dynasty to another device. Downloads may be blocked inside the Claude app; they work on the GitHub version.</p></div>';
 return '<section class="panel">' + b + '</section>';
}
ACT.saveTo = async v => { await saveGame(+v); await refreshMeta(); toast('Saved to slot ' + v + '.'); rerender(); };
ACT.export = () => { try { exportSave(); } catch (e) { toast("Your browser blocked the download."); } };

// boot
(async function boot() { try { await refreshMeta(); } catch (e) { } render(); })();

</script>
</html>
